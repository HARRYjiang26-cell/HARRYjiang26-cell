name: update profile

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # avatar.txt is hand-drawn and never regenerated here: it is the source
      # of the portrait, not an artefact of it.
      - name: Re-render portrait from avatar.txt
        run: python scripts/colored_svg.py avatar.txt --text-mode --out avatar.svg

      - name: Refresh stats block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_stats.py

      - name: Commit when something changed
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md avatar.svg
          git commit -m "chore: refresh profile card"
          git push
